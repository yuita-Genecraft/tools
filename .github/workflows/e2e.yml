name: Notification report E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notification-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    # Standard hosted runners are free for public repositories. Do not run
    # automatically if this repository (or a copy) becomes private.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check -r test/requirements-e2e.txt
      - name: Install Chromium and system dependencies
        id: browser
        run: python -m playwright install --with-deps chromium
      - name: Compare notification report against Python reference
        run: python -u test/e2e.py
      - name: Check overlapping session times
        # Collect both results even when the preceding comparison fails.
        # A failed comparison still makes the job fail.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python -u test/test_overlap.py
